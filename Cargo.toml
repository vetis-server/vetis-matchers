[package]
name = "vetis-matchers"
version = "0.1.0"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-static"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Static Files support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[features]
default = []

[dependencies]
cel = "0.16.0"
compact_str = { version = "0.10.0", features = ["serde", "smallvec"] }
http = "1.5.0"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
simplematch = "0.3.1"
typetag = "0.2.21"
vetis = { path = "../vetis/vetis" }

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5" }
deboa-tokio = { version = "0.1.4", default-features = false, features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }
vetis-tokio = { path = "../vetis-tokio" }
